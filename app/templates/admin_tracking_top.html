{# 시험 추적 대시보드 (상단 섹션) — admin_dashboard.html 에서 include #}
<link rel="stylesheet" href="/static/css/tracking.css">

<section class="card" id="tracking_top_section">
    <div class="section_header_row">
        <h3>제품 시험 및 개선 추적 현황</h3>
    </div>
    <div class="table_action_bar admin_table_action_bar_top">
        <button type="button" id="trk_view_toggle_btn"
                onclick="
                    const labels = ['보기모드: 전체','보기모드: 시험중','보기모드: 중단판정'];
                    const cur = parseInt(localStorage.getItem('trk_view_mode') || '0', 10);
                    const next = (cur + 1) % 3;
                    localStorage.setItem('trk_view_mode', next);
                    this.textContent = labels[next];
                    document.getElementById('trk_refresh_btn').click();
                ">
            보기모드: 전체
        </button>
        <script>
        (function(){
            var labels = ['보기모드: 전체','보기모드: 시험중','보기모드: 중단판정'];
            var btn = document.getElementById('trk_view_toggle_btn');
            var cur = parseInt(localStorage.getItem('trk_view_mode') || '0', 10);
            if (btn) btn.textContent = labels[cur] || labels[0];
        })();
        </script>
        <button type="button" id="trk_refresh_btn">
            ↻ 데이터 새로고침
        </button>
    </div>
    <div class="tracking_section" id="trk_root">
        <div class="trk_loading" id="trk_loading_msg">데이터 로딩 중…</div>
    </div>
</section>
<script src="/static/js/tracking-client-log.js"></script>
<script src="/static/js/tracking-helpers.js"></script>
<script src="/static/js/tracking-gantt-chart.js"></script>
<script src="/static/js/tracking-gantt-resize.js"></script>
<script src="/static/js/tracking-gantt-fold.js"></script>
